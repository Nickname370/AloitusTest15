  let currentNPC = 'ritari';

  function selectNPC(npcKey, btnElement) {
    currentNPC = npcKey;
    document.querySelectorAll('.npc-btn').forEach(btn => btn.classList.remove('active'));
    btnElement.classList.add('active');
    renderNode('start');
  }

  function renderNode(nodeKey) {
    const npc = npcs[currentNPC];
    const node = npc.nodes[nodeKey];

    document.getElementById('npc-avatar').textContent = npc.avatar;
    document.getElementById('npc-name').textContent = npc.name;
    document.getElementById('npc-text').textContent = node.text;

    const choicesDiv = document.getElementById('choices');
    choicesDiv.innerHTML = '';

    node.choices.forEach(choice => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = "> " + choice.text;
      btn.onclick = () => renderNode(choice.next);
      choicesDiv.appendChild(btn);
    });
  }

  // Käynnistetään peli
  renderNode('start');
